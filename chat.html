<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phòng Chat - AI SQL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712010.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 flex h-[100dvh] w-full overflow-hidden text-slate-800">

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden transition-opacity"></div>

    <aside id="main-sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-900 border-r border-slate-800 flex flex-col transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 shrink-0">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
            <h1 class="text-xl font-bold gradient-text">SQL_AI_Hub</h1>
            <div class="flex items-center gap-2">
                <button id="auth-action-btn" class="flex shrink-0 items-center justify-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-full border border-blue-500 text-blue-400 hover:bg-blue-600 hover:text-white transition whitespace-nowrap" title="Cài đặt tài khoản">
                    <span id="auth-btn-text">Đăng nhập</span>
                    <svg id="auth-gear-icon" class="w-3.5 h-3.5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
                <button id="btn-close-sidebar" class="md:hidden text-slate-400 hover:text-white text-2xl leading-none px-1">&times;</button>
            </div>
        </div>
        
        <div class="p-4 border-b border-slate-800 shrink-0">
            <div id="btn-private-chat" class="group flex items-center gap-3 p-3 rounded-lg bg-blue-600 cursor-pointer shadow-lg shadow-blue-500/20 transition-all">
                <div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center text-white font-bold">🤖</div>
                <div>
                    <h3 class="font-medium text-sm text-white">Hỏi đáp riêng tư</h3>
                    <p class="text-xs text-blue-200">Với AI Assistant</p>
                </div>
            </div>
        </div>

        <div class="px-4 pt-4 shrink-0">
            <button id="btn-open-create-room" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition border border-slate-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Tạo nhóm mới <span class="text-[10px] text-slate-400 font-normal">(Cần ĐN)</span>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-3 pb-4 space-y-1 mt-4" id="room-list">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3 px-2">Cộng đồng (Nhóm chung)</p>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 h-full relative bg-slate-50">
        <header class="bg-white border-b border-slate-200 px-4 py-3 md:px-6 md:py-4 flex justify-between items-center shadow-sm shrink-0 z-20">
            <div class="flex items-center gap-3">
                <button id="btn-open-sidebar" class="md:hidden p-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-lg transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div>
                    <h2 id="room-title" class="font-bold text-base md:text-lg text-slate-800 flex items-center gap-2">
                        <span id="room-icon">🤖</span> Khu Vực Hỏi Đáp Riêng
                    </h2>
                    <p id="user-email-display" class="text-[10px] md:text-xs text-slate-500 font-medium">Đang tải...</p>
                </div>
            </div>
            <button id="btn-group-options" class="hidden p-2 text-slate-500 hover:bg-slate-100 rounded-full transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
            </button>
        </header>
        
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 md:space-y-6 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-slate-50">
            <div class="text-center text-slate-400 mt-10">Đang tải dữ liệu...</div>
        </div>

        <footer class="p-3 md:p-4 bg-white border-t border-slate-200 shrink-0 z-20">
            <div class="relative flex items-center max-w-5xl mx-auto">
                <input type="text" id="user-input" placeholder="Nhập câu hỏi... (@bot để gọi AI)" class="w-full bg-slate-100 border border-slate-300 text-slate-800 rounded-2xl pl-4 md:pl-6 pr-12 md:pr-14 py-3 md:py-4 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="send-btn" class="absolute right-2 md:right-3 bg-blue-600 hover:bg-blue-700 text-white w-9 h-9 md:w-10 md:h-10 rounded-xl flex items-center justify-center transition">
                    <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </footer>

        <div id="group-drawer" class="fixed inset-y-0 right-0 z-50 w-72 md:w-80 bg-white border-l border-slate-200 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50 shrink-0">
                <h3 class="font-bold text-slate-800">Thông tin nhóm</h3>
                <button id="close-drawer-btn" class="text-slate-400 hover:text-red-500 font-bold">✖</button>
            </div>
            
            <div class="p-5 flex flex-col items-center border-b shrink-0">
                <label for="edit-group-avatar" class="cursor-pointer relative group mb-3">
                    <div id="drawer-group-avatar" class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-slate-200 flex items-center justify-center overflow-hidden border-2 border-slate-300"></div>
                    <div id="edit-avatar-overlay" class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity hidden">
                        <span class="text-white text-xs">Đổi</span>
                    </div>
                </label>
                <input type="file" id="edit-group-avatar" accept="image/*" class="hidden">
                
                <div class="flex items-center gap-2 w-full">
                    <input type="text" id="drawer-group-name" class="font-bold text-base md:text-lg text-center bg-transparent border-b border-transparent focus:border-blue-500 focus:outline-none w-full" readonly>
                    <button id="btn-save-group-name" class="hidden text-blue-600 text-sm font-bold">Lưu</button>
                </div>
                
                <button id="btn-copy-link" class="mt-4 flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full text-xs md:text-sm font-medium transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    Copy Link Mời
                </button>
            </div>

            <div class="p-3 md:p-4 bg-slate-50 border-b shrink-0">
                <h4 class="text-[10px] md:text-xs font-bold text-slate-500 uppercase">Thành viên (<span id="member-count">0</span>)</h4>
            </div>
            
            <div id="drawer-member-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>

            <div id="drawer-admin-actions" class="p-4 border-t hidden shrink-0">
                <button id="btn-delete-group" class="hidden w-full py-2 bg-red-50 text-red-600 border border-red-200 hover:bg-red-600 hover:text-white rounded-lg font-bold transition text-sm">Xóa Nhóm Này</button>
                <button id="btn-leave-group" class="hidden w-full py-2 bg-slate-100 text-slate-600 border border-slate-300 hover:bg-slate-200 hover:text-slate-800 rounded-lg font-bold transition text-sm">Rời Nhóm</button>
            </div>
        </div>
    </main>

    <div id="create-room-modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center backdrop-blur-sm px-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xl font-bold text-slate-800">Tạo Nhóm Mới</h2>
                <button id="close-create-room" class="text-slate-400 hover:text-red-500 text-xl font-bold">✖</button>
            </div>
            <div class="flex flex-col items-center mb-5">
                <label for="room-avatar-upload" class="cursor-pointer relative group">
                    <div id="room-avatar-preview" class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-slate-200 border-2 border-dashed border-slate-400 flex items-center justify-center overflow-hidden">
                        <span class="text-slate-500 text-sm">Ảnh</span>
                    </div>
                </label>
                <input type="file" id="room-avatar-upload" accept="image/*" class="hidden">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1">Tên nhóm</label>
                <input type="text" id="room-name-input" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nhập tên nhóm...">
            </div>
            <div class="flex gap-4 mb-4">
                <button id="btn-public" class="flex-1 py-2 rounded-lg font-medium border-2 border-blue-600 bg-blue-50 text-blue-600 transition text-sm md:text-base">Công Khai</button>
                <button id="btn-private" class="flex-1 py-2 rounded-lg font-medium border-2 border-slate-200 bg-white text-slate-600 transition hover:bg-slate-50 text-sm md:text-base">Bảo Mật</button>
            </div>
            <div id="room-password-container" class="hidden mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-1">Mật khẩu</label>
                <input type="password" id="room-password-input" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Tạo mật khẩu...">
            </div>
            <button id="confirm-create-room" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition">Tạo Nhóm Xong</button>
        </div>
    </div>

    <div id="join-room-modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center backdrop-blur-sm px-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <h2 class="text-lg md:text-xl font-bold text-slate-800 mb-2">Tham gia Nhóm</h2>
            <p class="text-xs md:text-sm text-slate-500 mb-5">Vui lòng nhập mật khẩu để tham gia.</p>
            <div class="mb-5">
                <input type="password" id="join-password" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nhập mật khẩu...">
            </div>
            <div class="flex gap-3">
                <button id="cancel-join-room" class="flex-1 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50 transition">Hủy</button>
                <button id="confirm-join-room" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition">Vào nhóm</button>
            </div>
        </div>
    </div>

    <div id="invite-link-modal" class="hidden fixed inset-0 bg-black/70 z-[60] flex items-center justify-center backdrop-blur-md px-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 md:p-8 text-center transform scale-95 transition-transform">
            <div id="invite-avatar" class="w-20 h-20 md:w-24 md:h-24 mx-auto rounded-full bg-slate-200 mb-4 border-4 border-blue-100 flex items-center justify-center overflow-hidden"></div>
            <h2 class="text-xl md:text-2xl font-extrabold text-slate-800 mb-1" id="invite-room-name">Tên Nhóm</h2>
            <p class="text-xs md:text-sm text-slate-500 mb-6 md:mb-8">Mời bạn tham gia vào nhóm chat này</p>
            <div id="invite-password-area" class="hidden mb-6 text-left">
                <label class="block text-sm font-bold text-slate-700 mb-1">Mật khẩu:</label>
                <input type="password" id="invite-password" class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none" placeholder="Nhập mật khẩu nhóm...">
            </div>
            <div class="flex flex-col gap-3">
                <button id="btn-accept-invite" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">Tham Gia Nhóm</button>
                <button id="btn-decline-invite" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition">Từ Chối</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center backdrop-blur-sm px-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-lg md:text-xl font-bold text-slate-800">Cài Đặt Tài Khoản</h2>
                <button id="close-settings-modal" class="text-slate-400 hover:text-red-500 text-xl font-bold">✖</button>
            </div>
            <div class="flex flex-col items-center mb-5">
                <label for="settings-avatar-upload" class="cursor-pointer relative group">
                    <div id="settings-avatar-preview" class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-slate-200 border-2 border-slate-300 flex items-center justify-center overflow-hidden">
                        <span class="text-slate-500 text-3xl font-bold">U</span>
                    </div>
                </label>
                <input type="file" id="settings-avatar-upload" accept="image/*" class="hidden">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-1">Tên hiển thị</label>
                <input type="text" id="settings-name-input" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none" placeholder="Nhập tên...">
            </div>
            <div class="flex flex-col gap-3">
                <button id="save-settings-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition">Lưu Thay Đổi</button>
                <button id="logout-settings-btn" class="w-full border border-red-500 text-red-500 hover:bg-red-500 hover:text-white font-bold py-2 rounded-lg transition">Đăng Xuất</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
